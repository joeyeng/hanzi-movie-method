services:
  # Next.js Frontend (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6003:6003"
    environment:
      - NODE_ENV=production
      - PORT=6003
      - HOSTNAME=0.0.0.0
      - HANZIPY_SERVER_URL=http://hanzipy:6004
    depends_on:
      - hanzipy
    restart: unless-stopped

  # HanziPy Flask Server (Character decomposition & dictionary lookup)
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "6004:6004"
    environment:
      - FLASK_ENV=production
      - PORT=6004
    restart: unless-stopped
