services:
  # Next.js Frontend (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HANZIPY_SERVER_URL=http://hanzipy:3001
      - TATOEBA_SERVER_URL=http://tatoeba:3002
    depends_on:
      - hanzipy
      - tatoeba
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - FLASK_ENV=production
      - PORT=3001
    restart: unless-stopped

  # Tatoeba Example Sentences Server
  tatoeba:
    build:
      context: ./tatoeba_server
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - FLASK_ENV=production
      - PORT=3002
    restart: unless-stopped
