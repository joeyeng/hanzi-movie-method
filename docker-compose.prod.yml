services:
  # Next.js Frontend (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - HANZIPY_SERVER_URL=http://hanzipy:4001
      - TATOEBA_SERVER_URL=http://tatoeba:4002
    depends_on:
      - hanzipy
      - tatoeba
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - FLASK_ENV=production
      - PORT=4001
    restart: unless-stopped

  # Tatoeba Example Sentences Server
  tatoeba:
    build:
      context: ./tatoeba_server
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - FLASK_ENV=production
      - PORT=4002
    restart: unless-stopped
