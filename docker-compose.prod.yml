services:
  # Next.js Frontend (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - NODE_ENV=production
      - PORT=6001
      - HOSTNAME=0.0.0.0
      - HANZIPY_SERVER_URL=http://hanzipy:6002
    depends_on:
      - hanzipy
    restart: unless-stopped

  # HanziPy Flask Server (Character decomposition & dictionary lookup)
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "6002:6002"
    environment:
      - FLASK_ENV=production
      - PORT=6002
    restart: unless-stopped
