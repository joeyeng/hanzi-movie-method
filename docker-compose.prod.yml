services:
  # Next.js Frontend (Production)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6000:6000"
    environment:
      - NODE_ENV=production
      - PORT=6000
      - HOSTNAME=0.0.0.0
      - HANZIPY_SERVER_URL=http://hanzipy:6001
      - TATOEBA_SERVER_URL=http://tatoeba:6002
    depends_on:
      - hanzipy
      - tatoeba
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - FLASK_ENV=production
      - PORT=6001
    restart: unless-stopped

  # Tatoeba Example Sentences Server
  tatoeba:
    build:
      context: ./tatoeba_server
      dockerfile: Dockerfile
    ports:
      - "6002:6002"
    environment:
      - FLASK_ENV=production
      - PORT=6002
    restart: unless-stopped
