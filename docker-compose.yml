services:
  # Next.js Frontend (Development with hot reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "6003:6003"
    environment:
      - NODE_ENV=development
      - HANZIPY_SERVER_URL=http://hanzipy:6001
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./src:/app/src:delegated
      - ./public:/app/public:delegated
      - ./next.config.ts:/app/next.config.ts:delegated
    depends_on:
      - hanzipy
    restart: unless-stopped

  # HanziPy Flask Server (Character decomposition & dictionary lookup)
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
    restart: unless-stopped

volumes:
  node_modules:
