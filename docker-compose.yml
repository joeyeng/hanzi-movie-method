services:
  # Next.js Frontend (Development with hot reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HANZIPY_SERVER_URL=http://hanzipy:5000
      - TATOEBA_SERVER_URL=http://tatoeba:5001
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - NEXT_WEBPACK_USEPOLLING=1
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - hanzipy
      - tatoeba
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

  # Tatoeba Example Sentences Server
  tatoeba:
    build:
      context: ./tatoeba_server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    restart: unless-stopped

volumes:
  node_modules:
