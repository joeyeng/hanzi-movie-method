services:
  # Next.js Frontend (Development with hot reload)
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - HANZIPY_SERVER_URL=http://hanzipy:3001
      - TATOEBA_SERVER_URL=http://tatoeba:3002
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./src:/app/src:delegated
      - ./public:/app/public:delegated
      - ./next.config.ts:/app/next.config.ts:delegated
    depends_on:
      - hanzipy
      - tatoeba
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    restart: unless-stopped

  # Tatoeba Example Sentences Server
  tatoeba:
    build:
      context: ./tatoeba_server
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped

volumes:
  node_modules:
