services:
  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HANZIPY_SERVER_URL=http://hanzipy:5000
    depends_on:
      - hanzipy
    restart: unless-stopped

  # HanziPy Flask Server
  hanzipy:
    build:
      context: ./hanzipy_server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  node_modules:
